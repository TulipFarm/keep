# Internal G0 go/no-go gate on LoCoMo, version 6, run through the local GitHub Copilot
# CLI (development split only; the sealed holdout is never loaded).
#
# NON-CANONICAL: the CLI adds its own hidden system prompt to every call and
# does not pin the upstream model, so these numbers are for the internal
# go/no-go decision only and are not comparable to published numbers or to
# the pinned-model G0 in locomo.toml. Every artifact is stamped non-canonical;
# only `compare --allow-non-canonical` accepts these runs, and its report is
# stamped INTERNAL / NON-CANONICAL.
# LoCoMo is CC BY-NC 4.0: non-commercial use only.
#
# Version 4: version 3 (same models, settings, fit mask, reranker, arms
# and prompts) plus per-session summaries and four arms: keep-k4 and
# keep-mk4, and the answer-v4 control arms dense-6k-v4 and
# full-context-v4. Versions 1 to 3 stay unchanged so their runs reproduce.
# Fill the extraction and summary caches first with `keep-bench extract`,
# or let the run fill them on first use (same credit cap).
# Version 6: version 5 (same models, settings, fit mask, arms and caps)
# plus consistent judge verdicts ([judge_consistency]: a verdict cache with
# one vote per distinct answer, so the run fits its credit cap), a 1,024-token answer
# reservation for answer-v6's working notes, and four arms: keep-k6 and
# keep-mk6, and the answer-v6 control arms dense-6k-v6 and full-context-v6.
# Versions 1 to 5 stay unchanged so their runs reproduce.
#
# Same datasets, embedding, retrieval, storage and seed as the pinned
# G0; only the models, budget and dispatch differ. See
# docs/benchmarks/running-g0.md. Needs a build with
# `--features local-embeddings`, a signed-in `copilot` on PATH and
# `--allow-model-calls`.
schema_version = 1
id = "g0-copilot-locomo-v6"
description = "Internal G0 v6 (non-canonical): consistent judge verdicts, answer-v6 working notes and inference rules plus answer-v6 controls; LoCoMo development split, gpt-5.6-luna answers, claude-haiku-4.5 judge"
phase = "development"
track = "development"
seeds = [1]
# Length-only fit mask for the assumed 125,000-token budget, from `keep-bench fit-mask`.
fit_mask = { path = "locomo-copilot.fit-mask.json", sha256 = "sha256:bf3df05fa340a2629a52b617d4cbb3ba4610f677c5ce90b9e0bbe11b6334724a" }

[dataset]
kind = "locomo"
path = "../../data/locomo/locomo10.json"
sha256 = "sha256:79fa87e90f04081343b8c8debecb80a9a6842b76a7aa537dc9fdf651ea698ff4"
gold_track = "original"

[holdout]
salt = "keep-locomo-holdout-v1"
fraction = 0.3
commitment = "sha256:fcb8fd651affba4d8d8acd1674d1ac2c362cc8a240b1994847075d50ff5f6a4d"

[models.answer]
# Same model settings as manifests/dev/longmemeval-s-copilot-dev.toml.
provider = "copilot-cli"
model = "gpt-5.6-luna"
revision = "unpinned-upstream"
tokenizer = "tiktoken-o200k-base"
# Assumes a 128K window: the CLI does not report the model's window without
# a model call. 128,000 minus the ~3,000 hidden harness tokens per call
# (overhead_tokens below) leaves 125,000 for Keep's prompt and the output.
# The longest LongMemEval-S history is about 106.6K tokens, so full context
# fits on every question.
context_limit = 125000
# answer-v6 writes working notes first. The CLI does not cap output;
# this only sizes the credit reservation.
max_output_tokens = 1024
temperature = 0.0
prompt_version = "answer-v1"
# Longer than the development slice: full-context prompts reach ~110K
# tokens and 16 CLI processes run at once.
timeout_secs = 300

[models.answer.copilot]
reasoning_effort = "low"
# Reservation rates, set above the rates observed in probes. Real charges
# come from the CLI's own usage report.
credits_per_1k_input = 0.03
credits_per_1k_output = 0.2
overhead_tokens = 3000

[models.judge]
# A different model family from the answer model. This model rejects a
# reasoning-effort setting, so none is passed.
provider = "copilot-cli"
model = "claude-haiku-4.5"
revision = "unpinned-upstream"
tokenizer = "tiktoken-o200k-base"
# The same assumed 128K window minus this model's ~2,300 hidden tokens.
context_limit = 125700
max_output_tokens = 16
temperature = 0.0
prompt_version = "judge-v1"
timeout_secs = 300

[models.judge.copilot]
credits_per_1k_input = 0.12
credits_per_1k_output = 0.6
overhead_tokens = 2300

[models.extract]
# Reads each session once and lists its dated facts (prompt
# session-facts-v2). Replies are cached on disk by model, prompt version and
# session text, so reruns and the other arms reuse them.
provider = "copilot-cli"
model = "gpt-5.6-luna"
revision = "unpinned-upstream"
tokenizer = "tiktoken-o200k-base"
context_limit = 125000
max_output_tokens = 3000
temperature = 0.0
prompt_version = "session-facts-v2"
timeout_secs = 300

[models.extract.copilot]
reasoning_effort = "low"
credits_per_1k_input = 0.03
credits_per_1k_output = 0.2
overhead_tokens = 3000

[embedding]
provider = "local-onnx"
model = "BAAI/bge-small-en-v1.5"
revision = "5c38ec7c405ec4b44b94cc5a9bb96e735b38267a"
dimensions = 384
batch_size = 64

[embedding.local]
pooling = "cls"
max_length = 512

[embedding.local.sha256]
"onnx/model.onnx" = "sha256:828e1496d7fabb79cfa4dcd84fa38625c0d3d21da474a00f08db0f559940cf35"
"tokenizer.json" = "sha256:d241a60d5e8f04cc1b2b3e9ef7a4921b27bf526d9f6050ab90f9267a1f9e5c66"
"config.json" = "sha256:094f8e891b932f2000c92cfc663bac4c62069f5d8af5b5278c4306aef3084750"
"special_tokens_map.json" = "sha256:b6d346be366a7d1d48332dbc9fdf3bf8960b5d879522b7799ddba59e76237ee3"
"tokenizer_config.json" = "sha256:9261e7d79b44c8195c1cada2b453e55b00aeb81e907a6664974b4d7776172ab3"

[reranker]
# Local cross-encoder that reorders the top fused candidates of the ranked
# Keep arms (k2, mk2). ms-marco-MiniLM-L6-v2 scores about 440 pairs a second
# on a 10-core laptop CPU, so reranking 50 candidates adds about 0.1 s per
# question. Downloaded at run time into KEEP_MODEL_CACHE and checked against
# these digests.
provider = "local-onnx"
model = "cross-encoder/ms-marco-MiniLM-L6-v2"
revision = "233902d25c440f23af6f7d6e94d2946bac0bee0a"
max_length = 512
top_n = 50

[reranker.sha256]
"onnx/model.onnx" = "sha256:5d3e70fd0c9ff14b9b5169a51e957b7a9c74897afd0a35ce4bd318150c1d4d4a"
"tokenizer.json" = "sha256:d241a60d5e8f04cc1b2b3e9ef7a4921b27bf526d9f6050ab90f9267a1f9e5c66"
"config.json" = "sha256:380e02c93f431831be65d99a4e7e5f67c133985bf2e77d9d4eba46847190bacc"
"special_tokens_map.json" = "sha256:3c3507f36dff57bce437223db3b3081d1e2b52ec3e56ee55438193ecb2c94dd6"
"tokenizer_config.json" = "sha256:a5c2e5a7b1a29a0702cd28c08a399b5ecc110c263009d17f7e3b415f25905fd8"

[extraction]
prompt_version = "session-facts-v2"
# The dated facts block comes first; the ranked mk2 or k2 fill takes the
# rest of the same budget.
facts_tokens = 1536
# mk3's Memory preference profile, standing context ahead of the facts.
profile_tokens = 512
# Typical reply length (mean of 2,901 development replies: 521), for
# the expected-cost line of the dry run.
expected_output_tokens = 520
# Session summaries (prompt session-summary-v1) for arms with
# `summaries = true`: one short summary per session, written by the
# extract model and cached beside the facts. They take at most this many
# tokens, and at most half of what the facts block leaves, out of the same
# budget, ahead of the ranked fill.
summary_prompt_version = "session-summary-v1"
summary_tokens = 512

[storage]
profile = "postgres-qdrant"

[retrieval]
chunking = "turn"
bm25_k1 = 1.2
bm25_b = 0.75
standing_tokens = 4096
evidence_tokens = 2000
max_tool_calls = 6

[budget]
# Copilot calls are capped in AI credits; the call, token and USD caps
# apply to OpenAI-compatible providers only. The cap is about 1.5 times the
# dry-run worst case (see docs/benchmarks/running-g0.md).
max_model_calls = 0
max_input_tokens = 0
max_output_tokens = 0
max_cost_usd = 0.0
max_ai_credits = 26000.0
max_attempts = 3

[dispatch]
# Still refused unless the command also passes --allow-model-calls.
allow_model_calls = true
# Bounds concurrent CLI processes (answer and judge share one gate).
concurrency = 16

[judge_consistency]
# One verdict per distinct (judge, question, gold, normalised answer),
# cached in .keep-cache/judgments (KEEP_JUDGE_CACHE) across arms and runs,
# so identical answers always get the same verdict. G0 uses one vote per
# answer; the dev manifests take a majority of three on borderline answers.
cache = true
votes = 1
vote_on = "borderline"

[[arms]]
name = "no-memory"
kind = "no-memory"

[[arms]]
name = "full-context"
kind = "full-context"

[[arms]]
name = "recent-window"
kind = "recent-window"
budget_tokens = 6096

[[arms]]
name = "bm25"
kind = "bm25"
budget_tokens = 2000
top_k = 20

[[arms]]
name = "dense"
kind = "dense"
budget_tokens = 2000
top_k = 20

# Equal-context baselines: standing_tokens + evidence_tokens, the most a
# combined Keep arm (mk0, mk1, mk2) may inject.
[[arms]]
name = "bm25-6k"
kind = "bm25"
budget_tokens = 6096
top_k = 200

[[arms]]
name = "dense-6k"
kind = "dense"
budget_tokens = 6096
top_k = 200

[[arms]]
name = "notes-grep"
kind = "notes-grep"
budget_tokens = 2000

[[arms]]
name = "oracle-evidence"
kind = "oracle-evidence"

[[arms]]
name = "keep-m"
kind = "keep"
path = "m"
representation = "structured"

[[arms]]
name = "keep-k0"
kind = "keep"
path = "k0"
representation = "structured"

[[arms]]
name = "keep-k1"
kind = "keep"
path = "k1"
representation = "structured"

[[arms]]
name = "keep-mk0"
kind = "keep"
path = "mk0"
representation = "structured"

[[arms]]
name = "keep-mk1"
kind = "keep"
path = "mk1"
representation = "structured"

# Ranked Keep arms (new in v2): one hybrid ranking (BM25 and dense fused
# with reciprocal rank fusion, then reranked) fills the budget. k2 gets
# evidence_tokens, the same as bm25 and dense; mk2 ranks Memory and
# Knowledge together and gets standing_tokens + evidence_tokens, the same as
# bm25-6k and dense-6k.
[[arms]]
name = "keep-k2"
kind = "keep"
path = "k2"
representation = "structured"

[[arms]]
name = "keep-mk2"
kind = "keep"
path = "mk2"
representation = "structured"

# Fact arms (new in v3): a dated block of extracted facts, grouped by
# subject and attribute with superseded values marked, then the k2 or mk2
# ranked fill in what is left of the same budget. k3 gets evidence_tokens
# like k2; mk3 gets standing_tokens + evidence_tokens like mk2, bm25-6k and
# dense-6k. temporal: the question's time reference boosts facts and
# evidence from that window and every fact shows its age. assistant_route:
# a question about the assistant's own earlier reply gets the plain ranked
# fill. preferences: mk3 opens with the Memory preference profile. Both
# answer with answer-v3;
# every other arm keeps [models.answer].prompt_version.
[[arms]]
name = "keep-k3"
kind = "keep"
path = "k3"
representation = "structured"
temporal = true
assistant_route = true
answer_prompt = "answer-v3"

[[arms]]
name = "keep-mk3"
kind = "keep"
path = "mk3"
representation = "structured"
temporal = true
assistant_route = true
preferences = true
answer_prompt = "answer-v3"

# Version 4 arms. k4 and mk4 are k3 and mk3 plus subject grounding
# (subjects: facts about a participant the question does not ask about are
# set apart under their own heading, and the block says who the question is
# about) and per-session summaries (summaries), answered with answer-v4.
# The entity expansion list (expand) is left out: it did not help on the
# development questions (docs/benchmarks/running-g0.md). dense-6k-v4 and full-context-v4 are the unchanged baselines
# answered with answer-v4, so the prompt's gain can be told apart from
# the memory's.
[[arms]]
name = "keep-k4"
kind = "keep"
path = "k3"
representation = "structured"
temporal = true
assistant_route = true
subjects = true
summaries = true
answer_prompt = "answer-v4"

[[arms]]
name = "keep-mk4"
kind = "keep"
path = "mk3"
representation = "structured"
temporal = true
assistant_route = true
preferences = true
subjects = true
summaries = true
answer_prompt = "answer-v4"

[[arms]]
name = "dense-6k-v4"
kind = "dense"
budget_tokens = 6096
top_k = 200
answer_prompt = "answer-v4"

[[arms]]
name = "full-context-v4"
kind = "full-context"
answer_prompt = "answer-v4"

[[arms]]
name = "keep-k5"
kind = "keep"
path = "k3"
representation = "structured"
temporal = true
assistant_route = true
subjects = true
summaries = true
provenance = true
relative_dates = true
decompose = true
fact_selection = true
answer_prompt = "answer-v5"

[[arms]]
name = "keep-mk5"
kind = "keep"
path = "mk3"
representation = "structured"
temporal = true
assistant_route = true
preferences = true
subjects = true
summaries = true
provenance = true
relative_dates = true
decompose = true
fact_selection = true
answer_prompt = "answer-v5"

[[arms]]
name = "dense-6k-v5"
kind = "dense"
budget_tokens = 6096
top_k = 200
answer_prompt = "answer-v5"

[[arms]]
name = "full-context-v5"
kind = "full-context"
answer_prompt = "answer-v5"

# Version 6 arms. keep-k6 and keep-mk6 are keep-k4 and keep-mk4 answered
# with answer-v6, which writes brief working notes (what is asked, the
# evidence, whether it is about the person asked about, the working) before
# a final "Answer:" line; only that line is judged. dense-6k-v6 and
# full-context-v6 are the unchanged baselines with the same prompt.
[[arms]]
name = "keep-k6"
kind = "keep"
path = "k3"
representation = "structured"
temporal = true
assistant_route = true
subjects = true
summaries = true
answer_prompt = "answer-v6"

[[arms]]
name = "keep-mk6"
kind = "keep"
path = "mk3"
representation = "structured"
temporal = true
assistant_route = true
preferences = true
subjects = true
summaries = true
answer_prompt = "answer-v6"

[[arms]]
name = "dense-6k-v6"
kind = "dense"
budget_tokens = 6096
top_k = 200
answer_prompt = "answer-v6"

[[arms]]
name = "full-context-v6"
kind = "full-context"
answer_prompt = "answer-v6"
