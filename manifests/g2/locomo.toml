# G2 development run on LoCoMo: canonical, pinned gpt-6-luna on Azure
# OpenAI (Data Zone Standard deployment, model version 2026-09-22) for the
# answer, judge and fact-extraction calls; local pinned embeddings and
# reranker. See docs/benchmarks/running-g2.md.
#
# Development split only; the sealed holdout is never loaded. The
# confirmation run is locomo-confirmation.toml.
# LoCoMo is CC BY-NC 4.0: non-commercial use only.
#
# Disclosed limitation: the judge is the same deployment as the answer
# model (only gpt-6-luna on Azure may be used), with its own judge prompt
# and no reasoning.
schema_version = 1
id = "g2-locomo"
description = "G2 development: LoCoMo development split, 3 seeds, gpt-6-luna (Azure, 2026-09-22) answers, judge and extraction; frozen candidate keep-mk7"
phase = "development"
seeds = [1, 2, 3]
# Length-only fit mask over the whole dataset (`keep-bench fit-mask`), against the
# 922,000-token input limit; every decision is re-checked after the run
# against Azure's reported prompt tokens.
fit_mask = { path = "locomo.fit-mask.json", sha256 = "sha256:0781d58dc958893b02a921197e3d9b374c361e8224c13fa098c378bb0f54c3b0" }

[dataset]
kind = "locomo"
path = "../../data/locomo/locomo10.json"
sha256 = "sha256:79fa87e90f04081343b8c8debecb80a9a6842b76a7aa537dc9fdf651ea698ff4"
gold_track = "original"

[holdout]
salt = "keep-locomo-holdout-v1"
fraction = 0.3
commitment = "sha256:fcb8fd651affba4d8d8acd1674d1ac2c362cc8a240b1994847075d50ff5f6a4d"

[models.answer]
# Azure OpenAI v1 endpoint: `model` is the deployment name, read from
# deployment_env. Reasoning tokens count toward max_output_tokens (sent
# as max_completion_tokens): 2,048 leaves room for low-effort reasoning
# plus the answer prompt's working notes (G0 v6 reserved 1,024 for the notes).
# Azure counts the whole allowance against the per-minute quota, so a
# larger one slows every call.
provider = "openai-compatible"
model = "gpt-6-luna"
revision = "2026-09-22"
# Every reply's `model` field must equal this, or the run stops sending.
served_model = "gpt-6-luna-2026-09-22"
# The vendor publishes no local tokenizer for gpt-6-luna; o200k is an
# estimate. Fit decisions are verified after the run against the prompt
# tokens Azure reports for every full-context call (docs/benchmarks/running-g2.md).
tokenizer = "tiktoken-o200k-base"
# Maximum input tokens for gpt-6-luna (1,050,000 context, 922,000 input).
context_limit = 922000
max_output_tokens = 2048
temperature = 0.0
reasoning_effort = "low"
prompt_version = "answer-v1"
timeout_secs = 600
api_style = "azure-v1"
auth_header = "api-key"
base_url_env = "KEEP_AZURE_OPENAI_ENDPOINT"
api_key_env = "KEEP_AZURE_OPENAI_API_KEY"
deployment_env = "KEEP_AZURE_OPENAI_DEPLOYMENT"
# Data Zone Standard short-context price in eastus, USD per million tokens
# (Azure Retail Prices API, meters "6-luna ShortCo Inp Std DZ" and
# "6-luna ShortCo Opt Std DZ", effective 2026-09-01, checked 2026-11-14).
input_usd_per_mtok = 0.11
output_usd_per_mtok = 0.55

[models.judge]
# Same deployment as the answer model (disclosed limitation), with the
# judge prompt. Reasoning off, so temperature 0 applies.
provider = "openai-compatible"
model = "gpt-6-luna"
revision = "2026-09-22"
# Every reply's `model` field must equal this, or the run stops sending.
served_model = "gpt-6-luna-2026-09-22"
# The vendor publishes no local tokenizer for gpt-6-luna; o200k is an
# estimate. Fit decisions are verified after the run against the prompt
# tokens Azure reports for every full-context call (docs/benchmarks/running-g2.md).
tokenizer = "tiktoken-o200k-base"
# Maximum input tokens for gpt-6-luna (1,050,000 context, 922,000 input).
context_limit = 922000
max_output_tokens = 16
temperature = 0.0
reasoning_effort = "none"
prompt_version = "judge-v1"
timeout_secs = 600
api_style = "azure-v1"
auth_header = "api-key"
base_url_env = "KEEP_AZURE_OPENAI_ENDPOINT"
api_key_env = "KEEP_AZURE_OPENAI_API_KEY"
deployment_env = "KEEP_AZURE_OPENAI_DEPLOYMENT"
# Data Zone Standard short-context price in eastus, USD per million tokens
# (Azure Retail Prices API, meters "6-luna ShortCo Inp Std DZ" and
# "6-luna ShortCo Opt Std DZ", effective 2026-09-01, checked 2026-11-14).
input_usd_per_mtok = 0.11
output_usd_per_mtok = 0.55

[models.extract]
# Session facts and summaries, cached on disk by model, prompt version and
# session text, so reruns, seeds and the other arms reuse them. 3,000
# output tokens as in G0 v6 (the mean reply was 521).
provider = "openai-compatible"
model = "gpt-6-luna"
revision = "2026-09-22"
# Every reply's `model` field must equal this, or the run stops sending.
served_model = "gpt-6-luna-2026-09-22"
# The vendor publishes no local tokenizer for gpt-6-luna; o200k is an
# estimate. Fit decisions are verified after the run against the prompt
# tokens Azure reports for every full-context call (docs/benchmarks/running-g2.md).
tokenizer = "tiktoken-o200k-base"
# Maximum input tokens for gpt-6-luna (1,050,000 context, 922,000 input).
context_limit = 922000
max_output_tokens = 3000
temperature = 0.0
reasoning_effort = "low"
prompt_version = "session-facts-v2"
timeout_secs = 600
api_style = "azure-v1"
auth_header = "api-key"
base_url_env = "KEEP_AZURE_OPENAI_ENDPOINT"
api_key_env = "KEEP_AZURE_OPENAI_API_KEY"
deployment_env = "KEEP_AZURE_OPENAI_DEPLOYMENT"
# Data Zone Standard short-context price in eastus, USD per million tokens
# (Azure Retail Prices API, meters "6-luna ShortCo Inp Std DZ" and
# "6-luna ShortCo Opt Std DZ", effective 2026-09-01, checked 2026-11-14).
input_usd_per_mtok = 0.11
output_usd_per_mtok = 0.55

[embedding]
provider = "local-onnx"
model = "BAAI/bge-small-en-v1.5"
revision = "5c38ec7c405ec4b44b94cc5a9bb96e735b38267a"
dimensions = 384
batch_size = 64

[embedding.local]
pooling = "cls"
max_length = 512

[embedding.local.sha256]
"onnx/model.onnx" = "sha256:828e1496d7fabb79cfa4dcd84fa38625c0d3d21da474a00f08db0f559940cf35"
"tokenizer.json" = "sha256:d241a60d5e8f04cc1b2b3e9ef7a4921b27bf526d9f6050ab90f9267a1f9e5c66"
"config.json" = "sha256:094f8e891b932f2000c92cfc663bac4c62069f5d8af5b5278c4306aef3084750"
"special_tokens_map.json" = "sha256:b6d346be366a7d1d48332dbc9fdf3bf8960b5d879522b7799ddba59e76237ee3"
"tokenizer_config.json" = "sha256:9261e7d79b44c8195c1cada2b453e55b00aeb81e907a6664974b4d7776172ab3"

[reranker]
# Local cross-encoder that reorders the top fused candidates of the ranked
# Keep arms (k2, mk2). ms-marco-MiniLM-L6-v2 scores about 440 pairs a second
# on a 10-core laptop CPU, so reranking 50 candidates adds about 0.1 s per
# question. Downloaded at run time into KEEP_MODEL_CACHE and checked against
# these digests.
provider = "local-onnx"
model = "cross-encoder/ms-marco-MiniLM-L6-v2"
revision = "233902d25c440f23af6f7d6e94d2946bac0bee0a"
max_length = 512
top_n = 50

[reranker.sha256]
"onnx/model.onnx" = "sha256:5d3e70fd0c9ff14b9b5169a51e957b7a9c74897afd0a35ce4bd318150c1d4d4a"
"tokenizer.json" = "sha256:d241a60d5e8f04cc1b2b3e9ef7a4921b27bf526d9f6050ab90f9267a1f9e5c66"
"config.json" = "sha256:380e02c93f431831be65d99a4e7e5f67c133985bf2e77d9d4eba46847190bacc"
"special_tokens_map.json" = "sha256:3c3507f36dff57bce437223db3b3081d1e2b52ec3e56ee55438193ecb2c94dd6"
"tokenizer_config.json" = "sha256:a5c2e5a7b1a29a0702cd28c08a399b5ecc110c263009d17f7e3b415f25905fd8"

[extraction]
prompt_version = "session-facts-v2"
# The dated facts block comes first; the ranked mk2 or k2 fill takes the
# rest of the same budget.
facts_tokens = 1536
# mk3's Memory preference profile, standing context ahead of the facts.
profile_tokens = 512
# Typical reply length (mean of 2,901 development replies: 521), for
# the expected-cost line of the dry run.
expected_output_tokens = 520
# Session summaries (prompt session-summary-v1) for arms with
# `summaries = true`: one short summary per session, written by the
# extract model and cached beside the facts. They take at most this many
# tokens, and at most half of what the facts block leaves, out of the same
# budget, ahead of the ranked fill.
summary_prompt_version = "session-summary-v1"
summary_tokens = 512

[storage]
profile = "postgres-qdrant"

[retrieval]
chunking = "turn"
bm25_k1 = 1.2
bm25_b = 0.75
standing_tokens = 4096
evidence_tokens = 2000
max_tool_calls = 6

[budget]
# About 1.2 times the four-arm development dry-run worst case ($39.29,
# 30,132 calls: every answer at 2,048 output tokens, inputs plus the reservation margin), with
# room for retries. The confirmation manifest keeps the same caps (its
# holdout estimate is lower) so every setting stays frozen. The G2 spend
# ledger reserves max_cost_usd before the first call and refuses a run past
# the --max-usd cap of scripts/run-g2-azure.sh.
max_model_calls = 36000
max_input_tokens = 240000000
max_output_tokens = 38000000
max_cost_usd = 48.0
# A 429 is retried after Retry-After and counts as an attempt.
max_attempts = 6

[dispatch]
# Still refused unless the command also passes --allow-model-calls.
allow_model_calls = true
concurrency = 4
# One shared pacer for every call to the deployment, kept under its quota
# (capacity 100 = 100,000 tokens and 600 requests per minute). Each request
# counts its prompt plus its whole output allowance, as Azure does. A 429
# pauses every caller for Retry-After; the run reports each wait. After
# raising the deployment's capacity, set KEEP_DISPATCH_TOKENS_PER_MINUTE and
# KEEP_DISPATCH_REQUESTS_PER_MINUTE (scripts/run-g2-azure.sh --capacity sets both)
# instead of editing this; run.json records the pacing used.
tokens_per_minute = 95000
requests_per_minute = 570

[judge_consistency]
# One verdict per distinct (judge, question, gold, normalised answer),
# cached in .keep-cache/judgments (KEEP_JUDGE_CACHE) across arms and runs,
# so identical answers always get the same verdict. G0 uses one vote per
# answer; the dev manifests take a majority of three on borderline answers.
cache = true
votes = 1
vote_on = "borderline"

[statistics]
# The G2 statistical test (the harness defaults, written out): a paired
# cluster bootstrap with Holm-adjusted 95% lower bounds over one family of
# four tests (two comparators x two storage profiles; each profile must also
# pass on its own), at least a 2-point mean gain, 99% completion and 80%
# full-context fit.
method = "paired-cluster-bootstrap-percentile"
bootstrap_resamples = 10000
bootstrap_seed = 20261112
confidence = 0.95
multiplicity = "holm"
min_gain_pp = 2.0
min_completion = 0.99
min_fit_fraction = 0.8

# G2 arms. The gate compares the frozen candidate keep-mk7 with the two
# preregistered comparators, full-context-v7 (complete history) and
# dense-6k-v7 (the plain dense retrieval baseline at the candidate's 6,096
# context tokens), all with the candidate's answer-v7 prompt so only memory
# differs. keep-mk6, the previous candidate, is reported but is not a gate
# comparator. scripts/run-g2-azure.sh passes exactly these comparators.
[[arms]]
name = "full-context-v7"
kind = "full-context"
answer_prompt = "answer-v7"

[[arms]]
name = "dense-6k-v7"
kind = "dense"
budget_tokens = 6096
top_k = 200
answer_prompt = "answer-v7"

[[arms]]
name = "keep-mk6"
kind = "keep"
path = "mk3"
representation = "structured"
temporal = true
assistant_route = true
preferences = true
subjects = true
summaries = true
answer_prompt = "answer-v6"

# The frozen candidate, as in G0 v7: keep-mk6 answered with answer-v7. To
# swap it, add the new arm here in all eight G2 manifests and set
# [confirmation].frozen_candidate to its name.
[[arms]]
name = "keep-mk7"
kind = "keep"
path = "mk3"
representation = "structured"
temporal = true
assistant_route = true
preferences = true
subjects = true
summaries = true
answer_prompt = "answer-v7"
