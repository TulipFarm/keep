# Offline timing slice for context building: the dev manifest's storage,
# embedding and arms on two questions, with mock answer and judge models so a
# run makes no model calls and spends nothing. Its scores are not results.
# Needs a build with `--features local-embeddings`; never pass
# `--allow-model-calls`. Run with `--timings` to print per-phase timings.
schema_version = 1
id = "longmemeval-s-ingest-timing"
description = "LongMemEval-S context-building timing slice (2 questions, mock models)"
phase = "development"
track = "development"
seeds = [1]

[dataset]
kind = "longmemeval-s"
path = "../../data/longmemeval/longmemeval_s_cleaned.json"
sha256 = "sha256:d6f21ea9d60a0d56f34a05b609c79c88a451d2ae03597821ea3d5a9678c3a442"
gold_track = "original"
subset = { path = "longmemeval-s-ingest-timing.subset.txt", sha256 = "sha256:d78f4b52f96918c0a671754d758ce2e05225c03fc6e1d76f9555e5cb49d4530b" }

[holdout]
salt = "keep-longmemeval-s-holdout-v1"
fraction = 0.3
commitment = "sha256:6c2ad58a42c74a2002a87149f20cb5cf973b6a84a41ab3d23ce96e71bb9b6559"

[models.answer]
provider = "mock"
model = "mock-answerer"
revision = "v1"
tokenizer = "tiktoken-o200k-base"
context_limit = 32768
max_output_tokens = 256
temperature = 0.0
prompt_version = "answer-v1"

[models.judge]
provider = "mock"
model = "mock-judge"
revision = "v1"
tokenizer = "tiktoken-o200k-base"
context_limit = 32768
max_output_tokens = 16
temperature = 0.0
prompt_version = "judge-v1"

[embedding]
provider = "local-onnx"
model = "BAAI/bge-small-en-v1.5"
revision = "5c38ec7c405ec4b44b94cc5a9bb96e735b38267a"
dimensions = 384
batch_size = 4

[embedding.local]
pooling = "cls"
max_length = 512

[embedding.local.sha256]
"onnx/model.onnx" = "sha256:828e1496d7fabb79cfa4dcd84fa38625c0d3d21da474a00f08db0f559940cf35"
"tokenizer.json" = "sha256:d241a60d5e8f04cc1b2b3e9ef7a4921b27bf526d9f6050ab90f9267a1f9e5c66"
"config.json" = "sha256:094f8e891b932f2000c92cfc663bac4c62069f5d8af5b5278c4306aef3084750"
"special_tokens_map.json" = "sha256:b6d346be366a7d1d48332dbc9fdf3bf8960b5d879522b7799ddba59e76237ee3"
"tokenizer_config.json" = "sha256:9261e7d79b44c8195c1cada2b453e55b00aeb81e907a6664974b4d7776172ab3"

[storage]
profile = "postgres-qdrant"

[budget]
max_model_calls = 0
max_input_tokens = 0
max_output_tokens = 0
max_cost_usd = 0.0
max_attempts = 1

[dispatch]
allow_model_calls = false
concurrency = 4

[[arms]]
name = "full-context"
kind = "full-context"

[[arms]]
name = "bm25"
kind = "bm25"
budget_tokens = 2000
top_k = 20

[[arms]]
name = "dense"
kind = "dense"
budget_tokens = 2000
top_k = 20

[[arms]]
name = "keep-m"
kind = "keep"
path = "m"
representation = "structured"

[[arms]]
name = "keep-k0"
kind = "keep"
path = "k0"
representation = "structured"

[[arms]]
name = "keep-k1"
kind = "keep"
path = "k1"
representation = "structured"

[[arms]]
name = "keep-mk0"
kind = "keep"
path = "mk0"
