# Parity run on LoCoMo under the `mem0-locomo` protocol: the answer
# prompt, judge prompts, question filter and scoring of Mem0's open memory-benchmarks harness (Apache-2.0),
# vendored in crates/keep-bench/protocols/. Covers the development split (6 of 10 conversations, categories 1-4: 971 questions).
#
# Development split: comparable in protocol, not in question set, to
# published numbers. The full-set variant is the -full file beside this one.
#
# NON-CANONICAL: run through the local GitHub Copilot CLI, which adds a
# hidden system prompt and does not pin the model. Every artifact is stamped
# INTERNAL / NON-CANONICAL.
# LoCoMo is CC BY-NC 4.0: non-commercial use only.
schema_version = 1
id = "parity-locomo-mem0-copilot"
description = "Parity (mem0-locomo, development split): LoCoMo, Copilot CLI gpt-5.6-luna answers and judge (non-canonical)"
phase = "development"
track = "development"
seeds = [1]

[protocol]
name = "mem0-locomo"
split = "dev"

[dataset]
kind = "locomo"
path = "../../data/locomo/locomo10.json"
sha256 = "sha256:79fa87e90f04081343b8c8debecb80a9a6842b76a7aa537dc9fdf651ea698ff4"
gold_track = "original"

[holdout]
salt = "keep-locomo-holdout-v1"
fraction = 0.3
commitment = "sha256:fcb8fd651affba4d8d8acd1674d1ac2c362cc8a240b1994847075d50ff5f6a4d"

[models.answer]
# GPT-5 family, the closest Copilot offers to the published readers
# (gpt-4o-mini in the Mem0 paper, gpt-5 in Mem0's 2026 numbers, gpt-4o for
# the LongMemEval judge); gpt-4o, gpt-4o-mini and gpt-5 are not offered.
provider = "copilot-cli"
model = "gpt-5.6-luna"
revision = "unpinned-upstream"
tokenizer = "tiktoken-o200k-base"
# Assumed 128K window minus the CLI's ~3,000 hidden tokens per call.
context_limit = 125000
max_output_tokens = 2048
temperature = 0.0
prompt_version = "mem0-locomo-answer-v1"
timeout_secs = 300

[models.answer.copilot]
reasoning_effort = "low"
credits_per_1k_input = 0.03
credits_per_1k_output = 0.2
overhead_tokens = 3000

[models.judge]
# The same model as the answerer, as in Mem0's published setups.
provider = "copilot-cli"
model = "gpt-5.6-luna"
revision = "unpinned-upstream"
tokenizer = "tiktoken-o200k-base"
context_limit = 125000
max_output_tokens = 256
temperature = 0.0
prompt_version = "mem0-locomo-judge-v1"
timeout_secs = 300

[models.judge.copilot]
reasoning_effort = "low"
credits_per_1k_input = 0.03
credits_per_1k_output = 0.2
overhead_tokens = 3000

[models.extract]
# Reads each session once and lists its dated facts (prompt
# session-facts-v2). Replies are cached on disk by model, prompt version and
# session text, so reruns and the other arms reuse them.
provider = "copilot-cli"
model = "gpt-5.6-luna"
revision = "unpinned-upstream"
tokenizer = "tiktoken-o200k-base"
context_limit = 125000
max_output_tokens = 3000
temperature = 0.0
prompt_version = "session-facts-v2"
timeout_secs = 300

[models.extract.copilot]
reasoning_effort = "low"
credits_per_1k_input = 0.03
credits_per_1k_output = 0.2
overhead_tokens = 3000

[embedding]
provider = "local-onnx"
model = "BAAI/bge-small-en-v1.5"
revision = "5c38ec7c405ec4b44b94cc5a9bb96e735b38267a"
dimensions = 384
batch_size = 64

[embedding.local]
pooling = "cls"
max_length = 512

[embedding.local.sha256]
"onnx/model.onnx" = "sha256:828e1496d7fabb79cfa4dcd84fa38625c0d3d21da474a00f08db0f559940cf35"
"tokenizer.json" = "sha256:d241a60d5e8f04cc1b2b3e9ef7a4921b27bf526d9f6050ab90f9267a1f9e5c66"
"config.json" = "sha256:094f8e891b932f2000c92cfc663bac4c62069f5d8af5b5278c4306aef3084750"
"special_tokens_map.json" = "sha256:b6d346be366a7d1d48332dbc9fdf3bf8960b5d879522b7799ddba59e76237ee3"
"tokenizer_config.json" = "sha256:9261e7d79b44c8195c1cada2b453e55b00aeb81e907a6664974b4d7776172ab3"

[reranker]
# Local cross-encoder that reorders the top fused candidates of the ranked
# Keep arms (k2, mk2). ms-marco-MiniLM-L6-v2 scores about 440 pairs a second
# on a 10-core laptop CPU, so reranking 50 candidates adds about 0.1 s per
# question. Downloaded at run time into KEEP_MODEL_CACHE and checked against
# these digests.
provider = "local-onnx"
model = "cross-encoder/ms-marco-MiniLM-L6-v2"
revision = "233902d25c440f23af6f7d6e94d2946bac0bee0a"
max_length = 512
top_n = 50

[reranker.sha256]
"onnx/model.onnx" = "sha256:5d3e70fd0c9ff14b9b5169a51e957b7a9c74897afd0a35ce4bd318150c1d4d4a"
"tokenizer.json" = "sha256:d241a60d5e8f04cc1b2b3e9ef7a4921b27bf526d9f6050ab90f9267a1f9e5c66"
"config.json" = "sha256:380e02c93f431831be65d99a4e7e5f67c133985bf2e77d9d4eba46847190bacc"
"special_tokens_map.json" = "sha256:3c3507f36dff57bce437223db3b3081d1e2b52ec3e56ee55438193ecb2c94dd6"
"tokenizer_config.json" = "sha256:a5c2e5a7b1a29a0702cd28c08a399b5ecc110c263009d17f7e3b415f25905fd8"

# Session fact extraction for keep-mk3 ([models.extract]). Fill
# the cache first with `keep-bench extract`, or let the run extract on
# first use (counted against the same caps).
[extraction]
prompt_version = "session-facts-v2"
facts_tokens = 1536
profile_tokens = 512
expected_output_tokens = 520

[storage]
profile = "postgres-qdrant"

[retrieval]
chunking = "turn"
bm25_k1 = 1.2
bm25_b = 0.75
standing_tokens = 4096
evidence_tokens = 2000
max_tool_calls = 6

[budget]
# Copilot calls are capped in AI credits: about 1.5 times the dry-run worst
# case (docs/benchmarks/parity.md).
max_model_calls = 0
max_input_tokens = 0
max_output_tokens = 0
max_cost_usd = 0.0
max_ai_credits = 7650.0
max_attempts = 3

[dispatch]
allow_model_calls = true
concurrency = 16

[[arms]]
name = "full-context"
kind = "full-context"

# Equal-context baselines: standing_tokens + evidence_tokens, the most the
# combined Keep arm may inject.
[[arms]]
name = "dense-6k"
kind = "dense"
budget_tokens = 6096
top_k = 200

[[arms]]
name = "bm25-6k"
kind = "bm25"
budget_tokens = 6096
top_k = 200

[[arms]]
name = "keep-mk2"
kind = "keep"
path = "mk2"
representation = "structured"

# mk2's ranked evidence behind a dated facts block extracted from each
# session and a Memory profile of the user's stated preferences, with the
# question's time reference boosting facts and evidence from that period
# (docs/knowledge.md). The answer prompt stays the protocol's own.
[[arms]]
name = "keep-mk3"
kind = "keep"
path = "mk3"
representation = "structured"
temporal = true
assistant_route = true
preferences = true
