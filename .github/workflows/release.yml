name: Release

# Started from a laptop with scripts/release.sh. Checks that main passed CI, picks the version from the commits,
# writes CHANGELOG.md and the Cargo version in a release commit, publishes ghcr.io/<owner>/keep from that commit
# (image.yml), then fast-forwards main to it, tags vX.Y.Z and creates the GitHub release.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump. auto reads the commits (feat → minor before 1.0, fix → patch)
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      version:
        description: Exact version, such as 1.2.3. Overrides bump
        required: false
        default: ""
      sha:
        description: The main commit you previewed. The release stops if main has moved since
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      base: ${{ steps.check.outputs.base }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.commit.outputs.sha }}
      branch: ${{ steps.commit.outputs.branch }}
    steps:
      - name: Release from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases run from main, not ${GITHUB_REF}."
          exit 1
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        name: Check main
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.sha }}
        run: |
          head=$(git rev-parse HEAD)
          if [ -n "$EXPECTED_SHA" ] && [ "$EXPECTED_SHA" != "$head" ]; then
            echo "::error::main moved from ${EXPECTED_SHA} to ${head} after the preview. Run the release again."
            exit 1
          fi
          # Release commits are pushed with the workflow token, which doesn't trigger CI, so check the last code commit.
          code=$(git log -1 --format=%H --invert-grep --grep='^chore(release):' HEAD)
          passed=$(gh run list --workflow ci.yml --commit "$code" --json conclusion \
            --jq 'map(select(.conclusion == "success")) | length')
          if [ "$passed" = "0" ]; then
            echo "::error::CI has not passed on ${code}."
            exit 1
          fi
          echo "base=${head}" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.2
      - id: version
        name: Version
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: |
          latest=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -n "$VERSION" ]; then
            if ! [[ "${VERSION#v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Version ${VERSION} is not X.Y.Z."
              exit 1
            fi
            tag="v${VERSION#v}"
            if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$tag" | sort -V | tail -1)" != "$tag" ]; then
              echo "::error::${tag} is not newer than ${latest}."
              exit 1
            fi
          else
            tag=$(git cliff --bump "$BUMP" --bumped-version)
          fi
          if [ "$tag" = "$latest" ] || [ -z "$(git log --format=%H --invert-grep --grep='^chore(release):' ${latest:+$latest..}HEAD)" ]; then
            echo "::error::Nothing to release since ${latest}."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::Tag ${tag} already exists."
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${tag} (previous: ${latest:-none})"
      # The image is built from the release commit, so `keep --version` reports the release. The commit waits on a
      # release/ branch until the image is published; main and the tag only move once it is.
      - id: commit
        name: Release commit
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          scripts/set-version.sh "$TAG"
          git cliff --tag "$TAG" --output CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md Cargo.toml Cargo.lock
          git commit --quiet --message "chore(release): ${TAG}"
          branch="release/${TAG}"
          git push --force origin "HEAD:refs/heads/${branch}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

  image:
    needs: prepare
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.tag }}

  publish:
    needs: [prepare, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.2
      - name: Push main and the tag
        env:
          BASE: ${{ needs.prepare.outputs.base }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$TAG" --message "Keep ${TAG}"
          # The lease fails the push if main moved while the image was building.
          git push --atomic --force-with-lease="refs/heads/main:${BASE}" origin HEAD:refs/heads/main "refs/tags/${TAG}"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          version="${TAG#v}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/keep"
          notes="$RUNNER_TEMP/notes.md"
          git cliff --latest --strip all --output "$notes"
          # The heading repeats the release title, so drop it.
          sed -i '1{/^## /d}' "$notes"
          cat >> "$notes" <<NOTES

          ### Container image

          \`\`\`sh
          docker pull ${image}:${version}
          \`\`\`

          Platforms \`linux/amd64\` and \`linux/arm64\`, with the on-device embedding model. Digest: \`${DIGEST}\`
          NOTES
          gh release create "$TAG" --verify-tag --title "Keep ${TAG}" --notes-file "$notes"
          {
            echo "Released [${TAG}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG})"
            echo
            echo "Image \`${image}:${version}\` (\`${image}@${DIGEST}\`)"
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    needs: [prepare, publish]
    if: always() && needs.prepare.outputs.branch != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete the release branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
        run: gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" || true
