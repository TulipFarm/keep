name: Image

# Builds deploy/Dockerfile with the on-device embedder (its pinned model
# baked in) for linux/amd64 and linux/arm64 on native runners, and pushes
# ghcr.io/<owner>/keep: `main` and `sha-<short>` from main, semver tags from
# `v*` tags. Pull requests that touch the image build it without pushing.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - deploy/Dockerfile
      - deploy/entrypoint.sh
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  KEEP_FEATURES: local-embeddings

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/keep" >> "$GITHUB_ENV"
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push by digest)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: KEEP_FEATURES=${{ env.KEEP_FEATURES }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ github.event_name == 'pull_request' && 'keep:ci' || '' }}
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || '' }}
          cache-from: type=gha,scope=image-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=image-${{ env.PLATFORM_PAIR }}
      - name: Smoke test
        run: |
          image=${{ github.event_name == 'pull_request' && 'keep:ci' || format('{0}@{1}', env.IMAGE, steps.build.outputs.digest) }}
          test "$(docker run --rm --entrypoint id "$image" -u)" = 10001
          docker run --rm --entrypoint sh "$image" -c 'ls -A "$KEEP_MODEL_CACHE" | grep -q .'
          # No network: the baked model must load without a download.
          docker run -d --network none --name keep-smoke "$image" serve
          for _ in $(seq 1 60); do
            if docker exec keep-smoke keep healthcheck; then ok=1; break; fi
            sleep 2
          done
          docker logs keep-smoke
          docker rm -f keep-smoke
          test "${ok:-}" = 1
      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
          echo "${{ matrix.platform }}: $digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/keep" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
      - name: Create the multi-platform manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          test -n "$(jq -r '.tags | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")" || {
            echo "no tags for ${GITHUB_REF}; nothing to publish"; exit 0; }
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
      - name: Print the digest
        run: |
          tag=$(jq -r '.tags[0] // empty' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          test -n "$tag" || exit 0
          docker buildx imagetools inspect "$tag"
          digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)
          echo "image digest: ${IMAGE}@${digest}"
          {
            echo "### ${IMAGE}"
            echo
            echo "Digest: \`${digest}\`"
            echo
            jq -r '.tags[] | "- `" + . + "`"' <<< "$DOCKER_METADATA_OUTPUT_JSON"
          } >> "$GITHUB_STEP_SUMMARY"
