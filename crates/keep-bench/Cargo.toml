[package]
name = "keep-bench"
description = "Keep's research harness: preregistered manifests, dataset loaders, baselines, scoring, statistics and reports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "keep-bench"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
clap.workspace = true
hex.workspace = true
keep-core.workspace = true
keep-memory.workspace = true
keep-knowledge.workspace = true
keep-postgres.workspace = true
keep-providers.workspace = true
keep-qdrant.workspace = true
keep-store.workspace = true
rand.workspace = true
rand_chacha.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tokio-postgres.workspace = true
toml.workspace = true

[features]
# Enables the `local-onnx` embedding provider (see keep-providers).
local-embeddings = ["keep-providers/local-embeddings"]

[dev-dependencies]
keep-ledger.workspace = true
tempfile.workspace = true
tokio-postgres.workspace = true

[lints]
workspace = true
