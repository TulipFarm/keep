# Offline fixture for the full Keep ablation: Memory only (M), Knowledge only
# (K0, K1) and both together (Mk0, Mk1) at the default 4,096-token standing
# budget and 2,000-token evidence allowance, next to a full-context reference,
# with mock providers.
schema_version = 1
id = "fixture-ablation-mock"
description = "Keep M, K0, K1, Mk0 and Mk1 arms on the synthetic LongMemEval-shaped fixture with offline mock providers"
phase = "development"
seeds = [1, 2, 3]

[dataset]
kind = "longmemeval-s"
path = "../longmemeval-mini.json"
sha256 = "sha256:1ec1c252d235236becd0664ca8937650bcf6b8a5ad3b8f5629e85547a9d60210"
annotations = { path = "../annotations-empty.toml", sha256 = "sha256:240f2fe79c687b4eaab208f6c3cd72a42b567d07a29671385878fbd3a813c166" }

[holdout]
salt = "fixture-holdout-v1"
fraction = 0.25
commitment = "sha256:1cd896a3192b353c565092d67d7717fffd2794209edd829db2d0e0a43c45547b"

[models.answer]
provider = "mock"
model = "mock-extractive"
revision = "v1"
tokenizer = "approx-v1"
context_limit = 8192
max_output_tokens = 64
prompt_version = "answer-v1"

[models.judge]
provider = "mock"
model = "mock-f1-judge"
revision = "v1"
tokenizer = "approx-v1"
context_limit = 4096
max_output_tokens = 8
prompt_version = "judge-v1"

[embedding]
provider = "hash"
model = "hash-embedder"
revision = "v1"
dimensions = 64

[storage]
profile = "in-memory"

[retrieval]
chunking = "turn"
bm25_k1 = 1.2
bm25_b = 0.75
standing_tokens = 4096
evidence_tokens = 2000
max_tool_calls = 6

[budget]
max_model_calls = 0
max_input_tokens = 0
max_output_tokens = 0
max_cost_usd = 0.0
max_attempts = 1

[[arms]]
name = "full-context"
kind = "full-context"

[[arms]]
name = "keep-m"
kind = "keep"
path = "m"
representation = "structured"

[[arms]]
name = "keep-k0"
kind = "keep"
path = "k0"
representation = "structured"

[[arms]]
name = "keep-k1"
kind = "keep"
path = "k1"
representation = "structured"

[[arms]]
name = "keep-mk0"
kind = "keep"
path = "mk0"
representation = "structured"

[[arms]]
name = "keep-mk1"
kind = "keep"
path = "mk1"
representation = "structured"
