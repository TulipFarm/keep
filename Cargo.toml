[workspace]
members = [
    "crates/keep-core",
    "crates/keep-providers",
    "crates/keep-store",
    "crates/keep-postgres",
    "crates/keep-qdrant",
    "crates/keep-bench",
    "crates/keep-memory",
    "crates/keep-ledger",
    "crates/keep-knowledge",
    "crates/keep-server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
license = "Apache-2.0"
homepage = "https://keep.tulipfarm.ai"
repository = "https://github.com/TulipFarm/keep"
publish = false

[workspace.dependencies]
keep-core = { path = "crates/keep-core" }
keep-providers = { path = "crates/keep-providers" }
keep-store = { path = "crates/keep-store" }
keep-postgres = { path = "crates/keep-postgres" }
keep-qdrant = { path = "crates/keep-qdrant" }
keep-memory = { path = "crates/keep-memory" }
keep-ledger = { path = "crates/keep-ledger" }
keep-knowledge = { path = "crates/keep-knowledge" }

anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
pgvector = { version = "0.4", features = ["postgres"] }
rand = "0.10"
rmcp = { version = "3.11", features = ["server", "transport-io"] }
rand_chacha = "0.10"
schemars = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
tiktoken-rs = "0.12"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
fastembed = { version = "7.8", default-features = false, features = ["ort-download-binaries-rustls-tls", "onig"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "fs"] }
tokio-postgres = "0.7"
toml = "1.2"
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4"] }
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
